name: Build and verify PulyTek
on:
  push:
    branches: [main]
    paths: ['src/**', 'vst/**', 'tools/**', 'tests/**', 'requirements-build.txt', '.github/workflows/build.yml', 'CMakeLists.txt', 'linux-vst3/**']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated stable v1.0.0 release
        type: boolean
        default: false
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-build.txt
          .venv/bin/python -m playwright install --with-deps chromium
      - name: DSP and native host tests
        run: .venv/bin/python tools/test.py
      - name: Build native ARMv7 effect and skin
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          ZIG_PATH=$(python -c 'import ziglang,pathlib; print(pathlib.Path(ziglang.__file__).parent / "zig")')
          python tools/build.py --target armv7 --zig "$ZIG_PATH"
          python tools/check_skin.py
          python tools/package.py
          python tools/test_package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PulyTek-armv7-release-candidate
          path: |
            dist/*
            docs/preview_*.png
            build/armv7/*.validation.json
      - name: Publish release candidate and root community manifest
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0 dist/*.zip dist/*.sha256 dist/PulyTek-source.tar.gz dist/openplugin.json docs/preview_*.png \
            --target "$GITHUB_SHA" --title "PulyTek 1.0.0 — Force/MPC" --notes-file docs/RELEASE.md
          cp dist/openplugin.json openplugin.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add openplugin.json
          git commit -m "Declare published PulyTek release candidate package"
          git push origin HEAD:main
  linux-vst3:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Linux VST3 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libfreetype6-dev libgl1-mesa-dev
      - name: Build optional Linux VST3
        run: |
          cmake -S . -B build/vst3 -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/vst3 --target PulyTek_VST3 --parallel 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PulyTek-Linux-VST3-desktop
          path: build/vst3/PulyTek_artefacts/Release/VST3/*
